<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Magnifying glass circle -->
  <circle cx="42" cy="42" r="30" stroke="currentColor" stroke-width="5.5" />
  <!-- Bar chart inside glass: 3 bars -->
  <rect x="28" y="42" width="8" height="18" rx="2" fill="currentColor" />
  <rect x="39" y="32" width="8" height="28" rx="2" fill="currentColor" />
  <rect x="50" y="38" width="8" height="22" rx="2" fill="currentColor" />
  <!-- Magnifying glass handle -->
  <line x1="65" y1="65" x2="85" y2="85" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />
</svg>
